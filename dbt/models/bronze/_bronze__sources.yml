version: 2
sources:
- name: bronze
  description: 'Zona cruda. Archivos Parquet que escribe el recurso CDC nativo de
    ADF (cdc_oltp_bronze) en abfss://bronze/<entidad>/, expuestos como tablas externas
    en MessyOpsDW. Inmutable: no se corrige nada aqui. Contrato con ADF: columnas
    del OLTP + cdc_operation (I/U/D) + ingested_at (hora UTC del microlote). El recurso
    entrega cambios netos: como maximo una fila por clave y microlote, asi que el
    orden entre eventos de una misma clave lo da ingested_at.'
  database: MessyOpsDW
  schema: bronze
  loader: adf_change_data_capture
  freshness:
    warn_after:
      count: 30
      period: minute
    error_after:
      count: 120
      period: minute
  loaded_at_field: ingested_at
  tables:
  - name: customers
    description: Cambios CDC netos de dbo.customers del OLTP real.
    columns:
    - name: customer_id
      description: Clave natural nvarchar del cliente en el OLTP.
      tests:
      - not_null
  - name: products
    description: Cambios CDC netos de dbo.products.
    columns:
    - name: product_id
      tests:
      - not_null
  - name: suppliers
    description: Cambios CDC netos de dbo.suppliers.
    columns:
    - name: supplier_id
      tests:
      - not_null
  - name: payments
    description: Cambios CDC netos de dbo.payments.
    columns:
    - name: payment_id
      tests:
      - not_null
  - name: sales_orders
    description: Cambios CDC netos de dbo.sales_orders.
    columns:
    - name: sales_order_id
      tests:
      - not_null
  - name: sales_order_lines
    description: Cambios CDC netos de dbo.sales_order_lines.
    columns:
    - name: sales_order_line_id
      tests:
      - not_null
  - name: invoices
    description: Cambios CDC netos de dbo.invoices.
    columns:
    - name: invoice_id
      tests:
      - not_null
  - name: shipments
    description: Cambios CDC netos de dbo.shipments.
    columns:
    - name: shipment_id
      tests:
      - not_null
  - name: warehouses
    description: Cambios CDC netos de dbo.warehouses.
    columns:
    - name: warehouse_id
      tests:
      - not_null
  - name: returns
    description: Cambios CDC netos de dbo.returns.
    columns:
    - name: return_id
      tests:
      - not_null
  - name: purchase_orders
    description: Cambios CDC netos de dbo.purchase_orders.
    columns:
    - name: purchase_order_id
      tests:
      - not_null
  - name: purchase_order_lines
    description: Cambios CDC netos de dbo.purchase_order_lines.
    columns:
    - name: purchase_order_line_id
      tests:
      - not_null
  - name: supplier_invoices
    description: Cambios CDC netos de dbo.supplier_invoices.
    columns:
    - name: supplier_invoice_id
      tests:
      - not_null
  - name: supplier_payments
    description: Cambios CDC netos de dbo.supplier_payments.
    columns:
    - name: supplier_payment_id
      tests:
      - not_null
  - name: inventory_snapshots
    description: Cambios CDC netos de dbo.inventory_snapshots.
    columns:
    - name: inventory_snapshot_id
      tests:
      - not_null
  - name: support_tickets
    description: Cambios CDC netos de dbo.support_tickets.
    columns:
    - name: support_ticket_id
      tests:
      - not_null
